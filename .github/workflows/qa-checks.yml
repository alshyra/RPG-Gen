name: Code Quality Checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-tests:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.2.0"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Install dependencies
        run: npm ci && npm run build

      - name: Run ESLint and TypeScript checks
        run: npm run lint

      - name: Run unit tests
        run: npm run test
        env:
          CI: true

  playwright-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        specs:
          - path: "tests/api-integration.spec.ts"
            name: "api-integration"
          - path: "tests/authentication.spec.ts"
            name: "authentication"
          - path: "tests/character-creation.spec.ts"
            name: "character-creation"
          - path: "tests/combat.spec.ts"
            name: "combat"
          - path: "tests/game-pages.spec.ts"
            name: "game-pages"
          - path: "tests/home.spec.ts"
            name: "home"
          - path: "tests/navigation.spec.ts"
            name: "navigation"
          - path: "tests/smoke.spec.ts"
            name: "smoke"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25.2.1"
          cache: "npm"
          cache-dependency-path: ./package-lock.json

      - name: Create backend .env for testing
        run: |
          mkdir -p packages/backend
          cat > packages/backend/.env << 'EOF'
          GOOGLE_API_KEY=test-key-will-be-mocked
          MONGODB_URI=mongodb://rpgadmin:rpgpass123@mongodb:27017/rpggen?authSource=admin
          NODE_ENV=production
          GOOGLE_OAUTH_CLIENT_ID=test-client-id
          GOOGLE_OAUTH_CLIENT_SECRET=test-client-secret
          GOOGLE_OAUTH_CALLBACK_URL=http://localhost:3001/auth/google/callback
          JWT_SECRET=test-jwt-secret-for-e2e-tests
          JWT_EXPIRES_IN=7d
          FRONTEND_URL=http://localhost
          # Enable auth bypass for E2E tests in CI (safe for CI only)
          DISABLE_AUTH_FOR_E2E=true
          EOF

      - name: Start production Docker containers
        env:
          DISABLE_AUTH_FOR_E2E: "true"
        run: |
          docker compose up --build -d mongodb backend frontend

      - name: Install dependencies and Playwright browsers
        working-directory: ./
        run: |
          npm ci && npm run build
          npx playwright install --with-deps chromium

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."

          # Wait for MongoDB (faster check)
          timeout 30 bash -c 'until docker compose exec -T mongodb mongosh --eval "db.adminCommand({ping: 1})" --quiet > /dev/null 2>&1; do sleep 1; done' || echo "MongoDB check timeout, continuing..."

          # Wait for backend to be healthy
          echo "Waiting for backend..."
          timeout 60 bash -c 'until curl -sf http://localhost:3001 > /dev/null 2>&1 || curl -sf http://localhost:3001/api > /dev/null 2>&1; do sleep 2; done' || {
            echo "Backend not responding, checking status..."
            docker compose ps backend
            docker compose logs --tail=30 backend
          }

          # Wait for frontend to be accessible
          echo "Waiting for frontend..."
          timeout 30 bash -c 'until curl -sf http://localhost/ > /dev/null 2>&1; do sleep 1; done' || {
            echo "Frontend not responding, checking status..."
            docker compose ps frontend
            docker compose logs --tail=30 frontend
            exit 1
          }

          echo "✓ All services are ready"

      - name: Prepare test DB (cleanup + seed)
        working-directory: .
        run: |
          npm run e2e:cleanup-db || true
          npm run e2e:prepare-db -- --count 2

      - name: Run Playwright tests
        working-directory: packages/e2e
        run: npx playwright test "${{ matrix.specs.path }}"
        env:
          CI: true

      - name: Show container logs on failure
        if: failure()
        run: |
          echo "=== Frontend logs ==="
          docker compose logs --tail=50 frontend
          echo ""
          echo "=== Backend logs ==="
          docker compose logs --tail=50 backend
          echo ""
          echo "=== MongoDB logs ==="
          docker compose logs --tail=20 mongodb

      - name: Stop Docker containers
        if: always()
        run: docker compose down -v

      - name: Upload Playwright screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-${{ matrix.specs.name }}
          path: packages/e2e/test-results/**/screenshots/
          if-no-files-found: ignore

      - name: Upload Playwright videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-videos-${{ matrix.specs.name }}
          path: packages/e2e/test-results/**/video.*
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.specs.name }}
          path: packages/e2e/playwright-report/
          if-no-files-found: ignore
